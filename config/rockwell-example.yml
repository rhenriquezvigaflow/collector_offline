# Plantilla local compatible con los YAML del Collector Central.
# Copie este archivo, cambie los datos de la laguna y selecciónelo mediante
# plcs[].include en collector-offline.yml.
lagoon_id: "mi_laguna_rockwell"
product_type: "crystal"

# Selector de PLC. Valores soportados: rockwell o siemens.
source: rockwell
poll_seconds: 1
timezone: "America/Santiago"

force_reconnect_every_sec: 3600
max_consecutive_fails: 10

# Se conserva por compatibilidad copy/paste con el Collector Central.
# El Collector Offline ignora este endpoint realtime.
backend:
  url: "http://127.0.0.1:8090/ingest/scada"

rockwell:
  ip: "192.168.1.10"
  slot: 0
  timeout_sec: 5

# Clave: identificador lógico enviado al backend.
# Valor: dirección/tag real dentro del PLC Rockwell.
tags:
  PT117_R: "PT117_R"
  FIT002_R: "FIT002_R"
  P006_ST: "P006_ST"

# Opcional. Usa el mismo contrato del Collector Central y fuerza la creación
# de eventos para los tags indicados.
event_tags:
  P006_ST: "Bomba de filtración"
