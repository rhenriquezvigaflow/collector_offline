[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystal-collector-offline"
version = "0.1.0"
description = "Nodo local de contingencia para captura y backfill SCADA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<0.136",
  "starlette>=1.3.1,<2",
  "pydantic>=2.12,<2.13",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "SQLAlchemy>=2.0,<3",
  "psycopg2-binary>=2.9,<3",
  "uvicorn>=0.40,<0.41",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
plc = [
  "opcua>=0.98.13,<0.99",
  "pycomm3>=1.2,<2",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
]

[project.scripts]
collector-offline = "collector_offline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "postgres: requires TEST_DATABASE_URL pointing at a disposable PostgreSQL database",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["collector_offline"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opcua.*", "pycomm3.*", "psycopg2.*"]
ignore_missing_imports = true
