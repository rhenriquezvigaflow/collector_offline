name: ${COMPOSE_PROJECT_NAME:-collector-offline}
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.7-bookworm@sha256:1757c628698dd1ca67ff7a5fc386bfd91040afc62a45484c346c788b0cbe5402}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crystal_offline}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      APP_DB_USER: ${APP_DB_USER:-collector_local}
      APP_DB_PASSWORD_FILE: /run/secrets/database_password
      TZ: UTC
    secrets:
      - postgres_password
      - database_password
    volumes:
      # PostgreSQL >=18 stores data beneath /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/010-app.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 128mb
    mem_limit: ${POSTGRES_MEMORY:-1g}
    cpus: ${POSTGRES_CPUS:-1.0}
    pids_limit: 256
    logging: *logging
  collector:
    image: ${COLLECTOR_IMAGE:?Configure COLLECTOR_IMAGE with a version or digest}
    platform: linux/amd64
    build:
      context: .
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-crystal_offline}
      APP_DB_USER: ${APP_DB_USER:-collector_local}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      COLLECTOR_OFFLINE_TOKEN_FILE: /run/secrets/central_token
      COLLECTOR_OFFLINE_PLC_USERNAME_FILE: /run/secrets/plc_username
      COLLECTOR_OFFLINE_PLC_PASSWORD_FILE: /run/secrets/plc_password
      TZ: ${TZ:-America/Santiago}
    secrets:
      - database_password
      - central_token
      - plc_username
      - plc_password
    volumes:
      - ./runtime/config:/etc/collector:ro
    networks: [database, uplink]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: ${STOP_GRACE_PERIOD:-180s}
    mem_limit: ${COLLECTOR_MEMORY:-512m}
    cpus: ${COLLECTOR_CPUS:-1.0}
    pids_limit: 128
    logging: *logging
networks:
  database:
    internal: true
  uplink:
    driver: bridge
volumes:
  postgres_data:
secrets:
  postgres_password:
    file: ./runtime/secrets/postgres_password
  database_password:
    file: ./runtime/secrets/database_password
  central_token:
    file: ./runtime/secrets/central_token
  plc_username:
    file: ./runtime/secrets/plc_username
  plc_password:
    file: ./runtime/secrets/plc_password
